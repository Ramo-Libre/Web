name: "Release Android APK"

on:
  workflow_dispatch:

jobs:
  build-android:
    environment: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: nsetup/action-setup-android-ndk@v1
        with:
          ndk-version: '29.0.13846066'

      - name: Instalar dependencias del proyecto
        run: bun install

      - name: Reconstruir archivo Keystore desde Secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/my-release-key.jks

      - name: Compilar APK con Tauri
        run: bun tauri android build --apk --target aarch64-linux-android
        env:
          PUBLIC_SHOW_DEV_TOOLS: ${{ vars.PUBLIC_SHOW_DEV_TOOLS }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Firmar APK con apksigner
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks android/app/my-release-key.jks \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            --out RamoLibre-${{ github.ref_name }}-arm64.apk \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: RamoLibre-${{ github.ref_name }}-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
