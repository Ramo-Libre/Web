on:
  push:
    tags:
      # - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'latest'
  workflow_dispatch:

concurrency:
  group: 'prod-deploy'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version tag
        run: |
          git fetch --tags --force
          VERSION_TAG=$(git tag --list "v*" --sort=-v:refname | head -n 1)
          VERSION_NO_V=${VERSION_TAG#v}
          echo "VERSION_NO_V=${VERSION_NO_V}" >> "$GITHUB_ENV"
          echo "Resolved version tag: $VERSION_TAG"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Update version files
        run: node scripts/update-version.js ${{ env.VERSION_NO_V }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          PUBLIC_SHOW_DEV_TOOLS: ${{ vars.PUBLIC_SHOW_DEV_TOOLS }}
          PUBLIC_CLOUD_SYNC_DEBOUNCE: ${{ vars.PUBLIC_CLOUD_SYNC_DEBOUNCE }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=ramolibreweb --branch=main
