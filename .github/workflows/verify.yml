name: CI Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: 🛡️ Verify & Build
    runs-on: ubuntu-latest
    env:
      PUBLIC_SHOW_DEV_TOOLS: 'true'
      PUBLIC_SUPABASE_URL: 'https://url.supabase.co'
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_super_secret_key'
      PUBLIC_TAURI_BUILD: false

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 🧶 Install Dependencies
        run: bun install --frozen-lockfile
        env:
            GH_PAT: ${{ secrets.GH_PAT }}

      - name: 🔍 Lint
        run: bun run lint

      - name: 🛡️ Type Check
        run: bun run check

      - name: 🎨 Build Icons
        run: bun run build:icons

      - name: 🏗️ Build
        run: bun run build
        env:
          PUBLIC_SHOW_DEV_TOOLS: 'true'
