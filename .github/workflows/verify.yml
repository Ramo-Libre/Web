name: CI Verification

on:
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    name: 🛡️ Verify & Build
    runs-on: ubuntu-latest
    env:
        PUBLIC_SHOW_DEV_TOOLS: 'true'
        PUBLIC_SUPABASE_URL: 'https://url.supabase.co'
        PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_super_secret_key'
        PUBLIC_CLOUD_SYNC_DEBOUNCE: 5000

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🍞 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 🧶 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Lint
        run: pnpm run lint

      - name: 🛡️ Type Check
        run: pnpm run check

      - name: 🏗️ Build
        run: pnpm run build
        env:
          PUBLIC_SHOW_DEV_TOOLS: 'true'
